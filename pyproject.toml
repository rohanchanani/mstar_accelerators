[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "mstar-accelerators"
version = "0.1.0"
description = "Typed implementation declarations and binding for M* nodes"
requires-python = ">=3.12"
dependencies = ["torch>=2.9.1,<2.13.0", "PyYAML>=6"]

[project.scripts]
mstar-accelerators = "mstar_accelerators.authoring:main"

[project.optional-dependencies]
test = ["pytest>=8.2", "transformers==4.57.3", "safetensors", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
