# Render model_path_hf with tools/whisper/prepare_assets.py and this template.
model: whisper
model_kwargs:
  model_path_hf: REPLACE_WITH_VERIFIED_LOCAL_CHECKPOINT
device_type: cpu
# Logical inputs, encoder outputs and persistent KV remain FP32. The authored
# CPU implementation explicitly chooses FP64 arithmetic and prepared weights.
autocast_dtype: float32
max_seq_len: 448
max_concurrent_requests: 2
preprocess_torch_threads: 1
resources:
  kv_cache:
    max_bytes: 16777216
    prefix_cache: false
  cross_kv_cache:
    max_bytes: 58720256
    prefix_cache: false
node_groups:
  - node_names: [audio_encoder]
    ranks: [0]
  - node_names: [decoder]
    ranks: [0, 1]
    tp_size: 2
runtime_extension:
  factory: mstar_accelerators.backends.torch.runtime:TorchRuntime
  accelerations: accelerations/whisper/cpu_tp2
  threads: 1
