# Render model_path_hf with tools/whisper/prepare_assets.py before serving.
model: whisper
model_kwargs:
  model_path_hf: REPLACE_WITH_VERIFIED_LOCAL_CHECKPOINT
device_type: mstar_pi
autocast_dtype: float32
max_seq_len: 448
max_concurrent_requests: 2
preprocess_torch_threads: 1
resources:
  kv_cache:
    max_bytes: 16777216  # tensor payload, including the resource-owned sink
    prefix_cache: false
  cross_kv_cache:
    max_bytes: 58720256
    prefix_cache: false
node_groups:
  - node_names: [audio_encoder, decoder]
    ranks: [0]
runtime_extension:
  factory: mstar_accelerators.backends.pi.runtime:PiRuntime
  accelerations: accelerations/whisper/pi_v3d
  native:
    render_node: /dev/dri/renderD128
    wait_timeout_ms: 180000
    validation: true
